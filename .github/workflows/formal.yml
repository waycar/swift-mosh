name: formal

on:
  push:
    branches: [main]
    paths: [formal/**, .github/workflows/formal.yml]
  pull_request:
    paths: [formal/**, .github/workflows/formal.yml]
  workflow_dispatch:

concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tlc:
    name: TLA+ models, quick tier (TLC, Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Model-check
        env:
          TLC_HEAP: 6g
        run: formal/check.sh
